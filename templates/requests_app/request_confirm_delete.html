{% extends "base.html" %}

{% block title %}Delete Request{% endblock %}

{% block content %}

<h2>Delete Request</h2>

<p>
Are you sure you want to delete this request?
</p>

<form method="POST">

    {% csrf_token %}

    <button class="btn btn-danger">
        Delete
    </button>

    <a href="{% url 'request_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
