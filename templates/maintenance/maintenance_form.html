{% extends "base.html" %}

{% block title %}Maintenance Form{% endblock %}

{% block content %}

<h2>{{ title }}</h2>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-success">
        Save
    </button>

    <a href="{% url 'maintenance_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
