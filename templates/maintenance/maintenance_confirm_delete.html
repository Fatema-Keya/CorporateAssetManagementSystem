{% extends "base.html" %}

{% block title %}Delete Maintenance{% endblock %}

{% block content %}

<h2>Delete Maintenance</h2>

<p>
Are you sure you want to delete this maintenance record?
</p>

<form method="POST">

    {% csrf_token %}

    <button class="btn btn-danger">
        Delete
    </button>

    <a href="{% url 'maintenance_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
