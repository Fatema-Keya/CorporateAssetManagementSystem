{% extends "base.html" %}

{% block title %}Delete Asset{% endblock %}

{% block content %}

<h2>Delete Asset</h2>

<p>

Are you sure you want to delete

<strong>{{ asset.asset_name }}</strong> ?

</p>

<form method="POST">

    {% csrf_token %}

    <button class="btn btn-danger">

        Yes Delete

    </button>

    <a href="{% url 'asset_list' %}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
