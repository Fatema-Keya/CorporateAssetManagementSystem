{% extends "base.html" %}

{% block title %}Asset Form{% endblock %}

{% block content %}

<h1 class="mb-4">

    {% if form.instance.pk %}
        Edit Asset
    {% else %}
        Add Asset
    {% endif %}

</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-success">

        Save

    </button>

    <a href="{% url 'asset_list' %}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
