<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Corporate Asset Management{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{
            min-height:100vh;
            background:#1f2937;
        }

        .brand{
            color:white;
            font-size:24px;
            font-weight:bold;
            padding:20px;
            text-align:center;
            border-bottom:1px solid rgba(255,255,255,.1);
        }

        .sidebar a{
            display:block;
            color:white;
            padding:14px 20px;
            text-decoration:none;
            transition:.2s;
        }

        .sidebar a:hover{
            background:#2563eb;
        }

        .topbar{
            background:white;
            padding:15px 25px;
            border-bottom:1px solid #ddd;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .content{
            padding:25px;
        }

        .username{
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-md-2 sidebar">

<div class="brand">
Asset System
</div>

<a href="/">🏠 Dashboard</a>

<a href="/employees/">👨‍💼 Employees</a>

<a href="/assets/">💻 Assets</a>

<a href="/maintenance/">🛠 Maintenance</a>

<a href="/requests/">📨 Employee Requests</a>

<a href="/reports/">📊 Reports</a>

<a href="/admin/">⚙️ Admin</a>

</div>

<div class="col-md-10 p-0">

<div class="topbar">

<div>

<h5 class="mb-0">
Corporate Asset Management System
</h5>

</div>

<div>

<span class="username">

{{ request.user.username }}

</span>

|

<a href="{% url 'logout' %}"
class="btn btn-sm btn-danger">

Logout

</a>

</div>

</div>

<div class="content">

{% if messages %}

{% for message in messages %}

<div class="alert alert-success alert-dismissible fade show">

{{ message }}

<button
class="btn-close"
data-bs-dismiss="alert">
</button>

</div>

{% endfor %}

{% endif %}

{% block content %}

{% endblock %}

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
